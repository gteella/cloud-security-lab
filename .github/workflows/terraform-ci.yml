name: Terraform CI

on:
  pull_request:
    branches:
      - main

jobs:
  terraform-check:
    name: Terraform Validation
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Install Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.16.4"

      - name: Check gitleaks
        uses: gitleaks/gitleaks-actions@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e

      - name: Check Terraform version
        run: terraform version

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform/w01-d01/environments/dev
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        working-directory: terraform/w01-d01/environments/dev
        run: terraform validate

      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          scan-type: config
          scan-ref: terraform/w01-d01
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Terraform Risk analysis
        run: |
          python3 scripts/analyse_plan.py \
            tests/fixtures/high-risk-plan.json \
            > risk-report.json

          cat risk-report.json

      - name: Enforce Terraform Risk Policy
        run: |
          RISK=$(jq -r '.overall_risk' risk-report.json)
          echo "Terraform risk level: $RISK"

          if [ "$RISK" = "BLOCK" ]; then
            echo "::error::Critical Terraform risk detected"
            exit 1
          fi

          if [ "$RISK" = "REVIEW" ]; then
            echo "::warning::Manual approval required"
          fi
